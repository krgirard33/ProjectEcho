{% extends "base.html" %}
{% block title %}Edit {{ project.name }}{% endblock %}

{% block content %}
<h1>Edit Project: {{ project.name }}</h1>

<form method="post">
    <label for="name">Project Name:</label>
    <input type="text" id="name" name="name" value="{{ project.name }}" required class="project-input-edit"><br>

    <label for="charging_code">Charging Code:</label>
    <input type="text" name="charging_code" value="{{ project.charging_code or '' }}" class="project-input-edit"><br>
    <!--
    <label for="status">Work Status:</label>
    <select name="status">
        <option value="active" {% if project.status=='active' %}selected{% endif %}>Active</option>
        <option value="on_hold" {% if project.status=='on_hold' %}selected{% endif %}>On Hold</option>
        <option value="completed" {% if project.status=='completed' %}selected{% endif %}>Completed</option>
    </select><br>
        -->
    <label for="is_active">Status:</label>
    <input type="checkbox" id="is_active" name="is_active" {% if project.is_active %}checked{% endif %}>
    <label for="is_active" style="display: inline; font-weight: normal;">Active</label><br>

    <button type="submit" style="margin-top: 20px;">Save Changes</button>
</form>

<p style="margin-top: 20px;">
    <a href="{{ url_for('projects_bp.projects') }}">← Back to Project List</a>
</p>
{% endblock %}
